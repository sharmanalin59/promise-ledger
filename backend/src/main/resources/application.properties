spring.application.name=promise-ledger

# Local-development defaults match docker-compose.yml. Override with environment variables elsewhere.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:promiseledger}
spring.datasource.username=${DB_USERNAME:promiseledger}
spring.datasource.password=${DB_PASSWORD:promiseledger}

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Claude API. The key has no default and must come from the environment.
claude.api-key=${ANTHROPIC_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-5-5}
claude.base-url=${CLAUDE_BASE_URL:https://api.anthropic.com}
claude.connect-timeout=${CLAUDE_CONNECT_TIMEOUT:10s}
claude.timeout=${CLAUDE_TIMEOUT:120s}
claude.max-tokens=${CLAUDE_MAX_TOKENS:16000}
claude.max-attempts=${CLAUDE_MAX_ATTEMPTS:3}
claude.retry-initial-backoff=${CLAUDE_RETRY_INITIAL_BACKOFF:500ms}
claude.retry-max-backoff=${CLAUDE_RETRY_MAX_BACKOFF:5s}
claude.circuit-failure-threshold=${CLAUDE_CIRCUIT_FAILURE_THRESHOLD:5}
claude.circuit-open-duration=${CLAUDE_CIRCUIT_OPEN_DURATION:30s}
claude.max-concurrent-calls=${CLAUDE_MAX_CONCURRENT_CALLS:4}
claude.concurrency-wait=${CLAUDE_CONCURRENCY_WAIT:5s}
claude.max-input-tokens=${CLAUDE_MAX_INPUT_TOKENS:100000}
claude.input-usd-per-million=${CLAUDE_INPUT_USD_PER_MILLION:3}
claude.output-usd-per-million=${CLAUDE_OUTPUT_USD_PER_MILLION:15}

# Session cookie for username/password login. Secure=false so local HTTP works.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Demo account created at startup when missing. Override password outside local use.
app.demo-user.enabled=${DEMO_USER_ENABLED:true}
app.demo-user.username=${DEMO_USERNAME:demo}
app.demo-user.password=${DEMO_PASSWORD:demo}
